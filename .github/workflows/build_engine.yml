name: WE-AOSP-Auto-Build

on:
  push:
    paths:
      - '**.apk'
      - '**.apks'
  workflow_dispatch:

jobs:
  build-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: 基地コードをチェックアウト
        uses: actions/checkout@v4

      - name: Java & Python & Node.js セットアップ
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ツールインストール (dex2jar, APKEditor, CheerpJ)
        run: |
          sudo apt-get update
          sudo apt-get install -y dex2jar
          pip install requests
          # APKEditorの取得
          curl -L -o APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar
          # CheerpJ CLIのインストール
          npm install -g @leaningtech/cheerpj

      - name: 1. APKの準備（APKsならマージ）
        run: |
          APKS_FILE=$(ls *.apks 2>/dev/null | head -n 1)
          if [ ! -z "$APKS_FILE" ]; then
            echo "📦 APKsを検知しました。マージを開始します: $APKS_FILE"
            java -jar APKEditor.jar m -i "$APKS_FILE" -o merged-app.apk
            TARGET_APK="merged-app.apk"
          else
            TARGET_APK=$(ls *.apk | head -n 1)
          fi
          
          if [ -z "$TARGET_APK" ]; then echo "❌ APKが見つかりません！"; exit 1; fi
          echo "TARGET_APK=$TARGET_APK" >> $GITHUB_ENV
          
          # JARへ変換
          d2j-dex2jar "$TARGET_APK" -o app-logic.jar

      - name: 2. 依存関係スキャン ＆ AOSP強奪
        run: |
          python scripts/scanner.py app-logic.jar > dependencies.txt
          python scripts/check_and_dl.py dependencies.txt

      - name: 3. Javaコンパイル ＆ CheerpJ変換
        run: |
          echo "🛠️ Javaソースを .class にコンパイル..."
          # vendor/java 内のソースをまとめてコンパイル
          find vendor/java -name "*.java" > sources.txt
          if [ -s sources.txt ]; then
            javac -cp app-logic.jar @sources.txt -d bin/
            echo "⚡ CheerpJ AOTコンパイルを実行..."
            # ここで bin/ 内のクラスをJS化
            # cheerpjfy bin/ ... (プロジェクトに合わせた引数)
          fi

      - name: 成果物の保存
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: we-ipa-package
          path: |
            vendor/java/
            app-logic.jar
            merged-app.apk
