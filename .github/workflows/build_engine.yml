name: WE-AOSP-Auto-Build

on:
  push:
    paths:
      - '**.apk'
      - '**.apks'
  workflow_dispatch:

jobs:
  build-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: 基地コードをチェックアウト
        uses: actions/checkout@v4

      - name: Java & Python & Node.js セットアップ
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: ツールインストール (Cheerp PPA ＆ dex2jar ＆ APKEditor)
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip software-properties-common default-jdk
          
          # 1. Cheerp PPAの追加とNoble向け強制書き換え
          sudo add-apt-repository -y ppa:leaningtech-dev/cheerp-nightly-ppa
          # Noble用が存在しない場合のためにJammy(22.04)をターゲットにする
          # sources.list.d 内のファイル名は環境によって微妙に変わるため、ワイルドカードで指定
          sudo sed -i 's/noble/jammy/g' /etc/apt/sources.list.d/*cheerp*.sources || true
          
          sudo apt-get update
          sudo apt-get install -y cheerp-core
          
          # 2. dex2jar v2.4 導入
          curl -L -o dex-tools.zip https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip
          unzip dex-tools.zip
          chmod +x dex-tools-v2.4/*.sh
          echo "$(pwd)/dex-tools-v2.4" >> $GITHUB_PATH
          
          # 3. APKEditor 取得
          curl -L -o APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar
          
          # 4. Python依存
          pip install requests
          
          echo "✅ 全ツールの準備完了（npmエラー回避版）"

      - name: 1. APKの準備（APKsならマージ）
        run: |
          APKS_FILE=$(ls *.apks 2>/dev/null | head -n 1)
          if [ ! -z "$APKS_FILE" ]; then
            echo "📦 APKsを検知。マージを開始します: $APKS_FILE"
            java -jar APKEditor.jar m -i "$APKS_FILE" -o merged-app.apk
            TARGET_APK="merged-app.apk"
          else
            TARGET_APK=$(ls *.apk | head -n 1)
          fi
          
          if [ -z "$TARGET_APK" ]; then echo "❌ APKが見つかりません！"; exit 1; fi
          echo "TARGET_APK=$TARGET_APK" >> $GITHUB_ENV
          
          # JARへ変換 (コマンド名は v2.4 の仕様に合わせて .sh を付与)
          d2j-dex2jar.sh "$TARGET_APK" -o app-logic.jar

      - name: 2. 依存関係スキャン ＆ AOSP強奪
        run: |
          python scripts/scanner.py app-logic.jar > dependencies.txt
          python scripts/check_and_dl.py dependencies.txt

      - name: 3. Javaコンパイル ＆ Cheerp変換
        run: |
          echo "🛠️ Javaソースを .class にコンパイル..."
          mkdir -p bin
          find vendor/java -name "*.java" > sources.txt
          if [ -s sources.txt ]; then
            javac -cp app-logic.jar @sources.txt -d bin/
            echo "⚡ Cheerpコンパイル（cheerp-core）の準備..."
            # ここに cheerp-core の実行コマンドを記述
          fi

      - name: 成果物の保存
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: we-ipa-package
          path: |
            vendor/java/
            app-logic.jar
            merged-app.apk
            dependencies.txt
